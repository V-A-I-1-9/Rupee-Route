<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="main-nav">
        <a class="navbar-brand" href="#">
            <img src="images/logo.png" alt="Expense Tracker Logo" height="30"
                class="d-inline-block align-top logo-small">
            <span class="brand-text">Rupee Route</span>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"> <a class="nav-link" href="index.html">Home</a> </li>
                <li class="nav-item active"> <a class="nav-link" href="add_expense.html">Add Expense</a> </li>
                <li class="nav-item"> <a class="nav-link" href="view_expenses.html">View Expenses</a> </li>
                <li class="nav-item"> <a class="nav-link" href="income.html">Manage Income</a> </li>
                <li class="nav-item"> <a class="nav-link" href="investments.html">Investments</a> </li>
                <li class="nav-item"> <a class="nav-link" href="budgets.html">Budgets</a> </li>
                <li class="nav-item"> <a class="nav-link" href="reports.html">Reports</a> </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5 pt-4">
        <h1 class="text-center mb-4">Add Expense</h1>
        <form id="expense-form">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" class="form-control" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select class="form-control" id="category" name="category_id" required>
                    <option value="">Select Category</option>
                    <!-- Categories will be loaded here -->
                </select>
            </div>
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" class="form-control" id="amount" name="amount" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="payment-method">Payment Method</label>
                <select class="form-control" id="payment-method" name="payment_method" required>
                    <option value="">Select Payment Method</option>
                    <option value="Cash">Cash</option>
                    <option value="Card">Card</option>
                    <option value="Online Transfer">Online Transfer</option>
                </select>
            </div>
            <div class="form-group">
                <label for="investment">Related Investment (Optional)</label>
                <select class="form-control" id="investment" name="investment_id">
                    <option value="">-- None --</option>
                    <!-- Investments loaded via JS -->
                </select>
            </div>
            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <textarea class="form-control" id="description" name="description" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Add Expense</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/script.js"></script>
    <script>
        // Function to load categories into the dropdown
        function loadCategories() {
            $.ajax({
                url: "get_categories.php", // Create this new PHP file
                type: "GET",
                dataType: "json",
                success: function (categories) {
                    const categorySelect = $("#category");
                    categories.forEach(function (category) {
                        categorySelect.append(`<option value="${category.id}">${category.name}</option>`);
                    });
                },
                error: function () {
                    alert("Error loading categories.");
                }
            });
        }
    </script>
</body>

</html>
