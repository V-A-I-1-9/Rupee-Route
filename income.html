         <!-- Navbar Content (Copy from index.html, update active link) -->

             <img src="images/logo.png" alt="Expense Tracker Logo" height="30" class="d-inline-block align-top logo-small">

         <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

             <ul class="navbar-nav">

             </ul>

    <div class="container mt-5 pt-4">
        <h1 class="text-center mb-4">Manage Income</h1>

        <!-- Add Income Form -->
        <div class="card bg-card mb-4">
            <div class="card-body">
                <h5 class="card-title">Add New Income</h5>
                <form id="income-form">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="income-date">Date</label>
                            <input type="date" class="form-control" id="income-date" name="date" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="income-source">Source</label>
                            <input type="text" class="form-control" id="income-source" name="source" placeholder="e.g., Salary, Rent" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="income-amount">Amount</label>
                            <input type="number" class="form-control" id="income-amount" name="amount" step="0.01" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="income-description">Description (Optional)</label>
                            <input type="text" class="form-control" id="income-description" name="description">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success">Add Income</button>
                </form>
            </div>
        </div>

        <!-- View Income Table -->
        <h2 class="text-center mb-3">Income History</h2>
        <div class="table-responsive">
            <table class="table table-striped table-bordered" id="income-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Source</th>
                        <th>Amount</th>
                        <th>Description</th>
                        <!-- Add Actions (Edit/Delete) if needed later -->
                    </tr>
                </thead>
                <tbody>
                    <!-- Income data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/script.js"></script>
    <script>
        $(document).ready(function() {
            loadIncome(); // Load income data when the page loads
        });
    </script>
</body>
</html>
