        <div class="container mt-5 pt-4">
            <h1 class="text-center mb-4">Manage Investments</h1>

            <!-- Add Investment Form -->
            <div class="card bg-card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Add New Investment</h5>
                    <form id="investment-form">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="inv-fund-name">Fund/Stock Name</label>
                                <input type="text" class="form-control" id="inv-fund-name" name="fund_name" required>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="inv-type">Investment Type</label>
                                <select class="form-control" id="inv-type" name="investment_type" required>
                                    <option value="">Select Type</option>
                                    <option value="Mutual Fund SIP">Mutual Fund SIP</option>
                                    <option value="Stock">Stock</option>
                                    <option value="Fixed Deposit">Fixed Deposit</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                         <div class="form-row">
                            <div class="form-group col-md-4">
                                <label for="inv-sip-amount">SIP Amount (Optional)</label>
                                <input type="number" class="form-control" id="inv-sip-amount" name="sip_amount" step="0.01">
                            </div>
                             <div class="form-group col-md-4">
                                <label for="inv-sip-day">SIP Day of Month (Optional)</label>
                                <input type="number" class="form-control" id="inv-sip-day" name="sip_day_of_month" min="1" max="31">
                            </div>
                            <div class="form-group col-md-4">
                                <label for="inv-start-date">Start Date (Optional)</label>
                                <input type="date" class="form-control" id="inv-start-date" name="start_date">
                            </div>
                        </div>
                        <div class="form-row">
                             <div class="form-group col-md-6">
                                <label for="inv-folio">Folio Number (Optional)</label>
                                <input type="text" class="form-control" id="inv-folio" name="folio_number">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="inv-notes">Notes (Optional)</label>
                                <textarea class="form-control" id="inv-notes" name="notes" rows="1"></textarea>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-info">Add Investment</button>
                    </form>
                </div>
            </div>

             <!-- View Investments Table -->
             <h2 class="text-center mb-3">Your Investments</h2>
             <div class="table-responsive">
                 <table class="table table-striped table-bordered" id="investments-table">
                     <thead>
                         <tr>
                             <th>ID</th>
                             <th>Fund Name</th>
                             <th>Type</th>
                             <th>SIP Amount</th>
                             <th>SIP Day</th>
                             <th>Start Date</th>
                             <th>Folio No.</th>
                             <th>Notes</th>
                             <!-- Add Actions if needed -->
                         </tr>
                     </thead>
                     <tbody>
                         <!-- Investment data will be loaded here -->
                     </tbody>
                 </table>
             </div>
        </div>
