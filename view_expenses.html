<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Expenses</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="main-nav">
        <a class="navbar-brand" href="#">
            <img src="images/logo.png" alt="Expense Tracker Logo" height="30" class="d-inline-block align-top logo-small">
            <span class="brand-text">Rupee Route</span>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"> <a class="nav-link" href="index.html">Home</a> </li>
                <li class="nav-item"> <a class="nav-link" href="add_expense.html">Add Expense</a> </li>
                <li class="nav-item active"> <a class="nav-link" href="view_expenses.html">View Expenses</a> </li>
                <li class="nav-item"> <a class="nav-link" href="income.html">Manage Income</a> </li>
                <li class="nav-item"> <a class="nav-link" href="investments.html">Investments</a> </li>
                <li class="nav-item"> <a class="nav-link" href="budgets.html">Budgets</a> </li>
                <li class="nav-item"> <a class="nav-link" href="reports.html">Reports</a> </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5 pt-4">
        <h1 class="text-center mb-4">View Expenses</h1>

        <div class="table-responsive">
            <table class="table table-striped table-bordered" id="expenses-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Payment Method</th>
                        <th>Investment</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Expenses will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-labelledby="editModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit Expense</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="edit-expense-form">
                        <input type="hidden" id="edit-id">
                        <div class="form-group">
                            <label for="edit-date">Date</label>
                            <input type="date" class="form-control" id="edit-date" required>
                        </div>
                        <div class="form-group">
                            <label for="edit-category">Category</label>
                            <select class="form-control" id="edit-category" name="category_id" required>
                                 <!--Categories are loaded here-->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="edit-amount">Amount</label>
                            <input type="number" class="form-control" id="edit-amount" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="edit-payment-method">Payment Method</label>
                            <select class="form-control" id="edit-payment-method" required>
                                <option value="Cash">Cash</option>
                                <option value="Card">Card</option>
                                <option value="Online Transfer">Online Transfer</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="edit-investment">Related Investment (Optional)</label>
                            <select class="form-control" id="edit-investment" name="investment_id">
                                 <option value="">-- None --</option>
                                <!-- Investments loaded via JS -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="edit-description">Description (Optional)</label>
                            <textarea class="form-control" id="edit-description" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="save-edit-btn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/script.js"></script>

    <script>
        // Load expenses when the page loads
        $(document).ready(function () {
            loadExpenses();
            loadCategoriesEditModal();
            loadInvestmentsDropdownEditModal(); // Load investments for the modal
        });
    </script>
</body>

</html>
